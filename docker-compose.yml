services:
  postgres_db:
    image: postgres:16-alpine
    container_name: bus_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bus_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bus_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-bus_booking_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bus_admin} -d ${DB_NAME:-bus_booking_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bus_backend_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: "postgres_db"
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-bus_admin}
      DB_PASSWORD: ${DB_PASSWORD:-bus_secure_pass_2026}
      DB_NAME: ${DB_NAME:-bus_booking_db}
      DB_SSLMODE: "disable"
      GIN_MODE: "release"
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
